[project]
name = "trade-doc-checker"
version = "0.1.0"
description = "Checks commodity trade invoices against their sales contracts using an LLM for extraction and plain code for the checks."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "pydantic>=2",
    "pypdf",
    "python-dotenv",
    "python-multipart",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]
generate = ["pillow", "playwright", "pypdfium2"]
# Reads scanned (image-only) PDFs for the source-quote check. About 200 MB.
ocr = ["numpy", "pypdfium2", "rapidocr-onnxruntime"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["checker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
